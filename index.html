<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krishna Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #e0f7ff, #fff4d6);
      color: #222;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    .box {
      background: white;
      margin: 20px auto;
      padding: 25px;
      max-width: 500px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1746a2;
    }

    #mainContent {
      display: none;
      margin: 20px auto;
      padding: 30px;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    footer {
      margin-top: 40px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🦚 Krishna Website</h1>
    <p>Welcome to my website!</p>
  </header>

  <div class="box" id="welcomeBox">
    <h2>🙏 Welcome</h2>
    <p>This is my first website created with HTML and CSS.</p>

    <button onclick="startWebsite()">
      Start
    </button>
  </div>

  <div id="mainContent">
    <h2>🦚 Welcome to Krishna Website</h2>
    <p>🙏 This is the main page of my Krishna Website.</p>
    <p>✨ जय श्री कृष्ण ✨</p>
  </div>

  <footer>
    © 2026 Krishna Website
  </footer>

  <script>
    function startWebsite() {
      document.getElementById("welcomeBox").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    }
  </script>

</body>
</html>
